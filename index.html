<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 연타 배틀 - TAP BATTLE</title>

<meta name="description" content="140명이 동시에 붙는 실시간 연타 대결! 닉네임만 입력하고 방에 들어와 10초간 미친 듯이 두드려 1위에 도전하세요.">
<meta property="og:title" content="⚡ 연타 배틀 - 실시간 두드리기 대결">
<meta property="og:description" content="3초 카운트 후 10초간 연타! 살아남는 자가 1위. 지금 도전하세요.">

<!-- 폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap" rel="stylesheet">

<!-- Firebase (기존 강화 시뮬과 동일한 프로젝트 재사용) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root{
  --bg:#070711;
  --bg2:#14002a;
  --neon:#39ff14;
  --gold:#ffd24a;
  --pink:#ff2e88;
  --cyan:#00e5ff;
  --panel:rgba(18,12,38,.82);
  --line:#2b2350;
  --txt:#e9e6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Do Hyeon',sans-serif;
  color:var(--txt);
  background:
    radial-gradient(1200px 600px at 50% -10%, #2a0050 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 110%, #003244 0%, transparent 55%),
    linear-gradient(160deg,#070711,#0c0820 60%,#120030);
  background-attachment:fixed;
  overflow-x:hidden;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
/* CRT 스캔라인 + 비네팅 오버레이 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.12) 2px 3px);
  mix-blend-mode:multiply;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;
  box-shadow:inset 0 0 220px rgba(0,0,0,.75);
}
.arcade{font-family:'Press Start 2P',monospace;}

/* ===== 공통 패널/버튼 ===== */
.panel{
  background:var(--panel);
  border:2px solid var(--line);
  border-radius:14px;
  box-shadow:0 0 0 2px #000, 0 10px 30px rgba(0,0,0,.5), inset 0 0 30px rgba(120,60,255,.06);
  backdrop-filter:blur(4px);
}
.btn{
  font-family:'Do Hyeon',sans-serif;
  cursor:pointer;border:none;border-radius:12px;
  padding:13px 18px;font-size:17px;color:#0a0a14;font-weight:bold;
  background:linear-gradient(180deg,#5cff3a,#23c00a);
  box-shadow:0 4px 0 #137000, 0 0 18px rgba(57,255,20,.45);
  transition:transform .06s, box-shadow .06s, filter .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #137000,0 0 10px rgba(57,255,20,.4);}
.btn.gold{background:linear-gradient(180deg,#ffe07a,#f0b400);box-shadow:0 4px 0 #8a5e00,0 0 18px rgba(255,210,74,.45);}
.btn.pink{background:linear-gradient(180deg,#ff5ca3,#e00a64);color:#fff;box-shadow:0 4px 0 #80003a,0 0 18px rgba(255,46,136,.45);}
.btn.ghost{background:transparent;color:var(--txt);border:2px solid var(--line);box-shadow:none;}
.btn:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed;box-shadow:none;}
input[type=text]{
  font-family:'Do Hyeon',sans-serif;font-size:16px;color:#fff;
  background:#0c0820;border:2px solid var(--line);border-radius:10px;
  padding:12px 14px;outline:none;width:100%;
}
input[type=text]:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,.3);}

/* ===== 로그인 ===== */
#loginScreen{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;
}
.logo{
  font-family:'Press Start 2P',monospace;font-size:30px;line-height:1.5;
  color:#fff;text-shadow:0 0 8px var(--neon),0 0 18px var(--neon),4px 4px 0 #000;
  animation:logoBob 1.6s ease-in-out infinite;
}
.logo .y{color:var(--gold);text-shadow:0 0 8px var(--gold),0 0 18px var(--gold),4px 4px 0 #000;}
@keyframes logoBob{50%{transform:translateY(-6px) rotate(-1deg);}}
.logo-sub{font-size:18px;color:var(--cyan);letter-spacing:2px;}
.login-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;padding:24px;}
.login-tip{font-size:14px;color:#9b93c9;line-height:1.5;}

/* ===== 앱 레이아웃 ===== */
#app{display:none;max-width:1100px;margin:0 auto;padding:14px 14px 40px;}
.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;margin-bottom:14px;
}
.topbar .title{font-family:'Press Start 2P';font-size:14px;color:var(--neon);text-shadow:2px 2px 0 #000;}
.topbar .spacer{flex:1;}
.pill{
  font-size:14px;padding:7px 12px;border-radius:999px;border:2px solid var(--line);
  background:#0c0820;display:flex;align-items:center;gap:7px;
}
.dot-live{width:9px;height:9px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:blink 1.2s infinite;}
@keyframes blink{50%{opacity:.25;}}
.mybadge{color:var(--gold);}

/* 로비 그리드 */
.lobby{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;}
.lobby .col{display:flex;flex-direction:column;gap:14px;}
.section-title{font-family:'Press Start 2P';font-size:12px;color:var(--cyan);margin:0 0 12px;text-shadow:1px 1px 0 #000;}
.section-title.g{color:var(--gold);}
.pad{padding:16px;}

/* 방 만들기 */
.make-room{display:flex;gap:8px;}
.make-room input{flex:1;}
.make-room .btn{white-space:nowrap;}

/* 방 목록 */
.room-list{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow-y:auto;}
.room-item{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;
  background:#0e0a22;border:1px solid var(--line);
}
.room-item .rname{flex:1;font-size:17px;}
.room-item .rmeta{font-size:13px;color:#9b93c9;}
.room-item .rstate{font-size:12px;padding:3px 9px;border-radius:999px;font-family:'Press Start 2P';}
.st-wait{background:#0c3b1a;color:var(--neon);}
.st-play{background:#3b0c2a;color:var(--pink);animation:blink 1s infinite;}
.room-empty{color:#6b6499;text-align:center;padding:26px;font-size:15px;}

/* 랭킹 */
.rank-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;background:#0e0a22;}
.rank-row .no{font-family:'Press Start 2P';font-size:12px;width:28px;color:#9b93c9;}
.rank-row .nm{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-row .sc{font-family:'Press Start 2P';font-size:13px;color:var(--gold);}
.rank-row.top1{background:linear-gradient(90deg,rgba(255,210,74,.22),transparent);border:1px solid var(--gold);}
.rank-row.top2{background:linear-gradient(90deg,rgba(200,200,220,.16),transparent);}
.rank-row.top3{background:linear-gradient(90deg,rgba(205,127,50,.18),transparent);}
.rank-row.me{outline:2px solid var(--cyan);}

/* 채팅 */
.chat-box{display:flex;flex-direction:column;height:300px;}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px;font-size:15px;line-height:1.4;}
.chat-msgs .cm .u{color:var(--cyan);font-weight:bold;}
.chat-msgs .cm.sys{color:var(--gold);font-size:14px;}
.chat-input{display:flex;gap:8px;margin-top:10px;}
.chat-input input{flex:1;}

/* ===== 방(게임) 화면 ===== */
#roomView{display:none;}
.room-top{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:12px;}
.room-top .rn{flex:1;font-size:20px;color:var(--gold);}
.game-wrap{display:grid;grid-template-columns:1fr 280px;gap:14px;}
@media(max-width:820px){
  .lobby{grid-template-columns:1fr;}
  .game-wrap{grid-template-columns:1fr;}
  .logo{font-size:22px;}
}

/* 스테이지 */
#stage{
  position:relative;min-height:460px;border-radius:16px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%, #1a0030 0%, #0a0418 70%);
  border:2px solid var(--line);box-shadow:inset 0 0 60px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  touch-action:none;
}
#stage.flash{animation:stageFlash .12s;}
@keyframes stageFlash{0%{background:radial-gradient(120% 120% at 50% 0%, #3a0060, #160030 70%);}100%{}}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;}

/* 카운트다운 */
.center-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:4;gap:14px;padding:20px;}
.count-num{font-family:'Press Start 2P';font-size:120px;color:#fff;text-shadow:0 0 20px var(--pink),0 0 40px var(--pink);animation:countPop .9s ease-out;}
@keyframes countPop{0%{transform:scale(2.2);opacity:0;}30%{opacity:1;}100%{transform:scale(1);opacity:.15;}}
.count-go{font-family:'Press Start 2P';font-size:56px;color:var(--neon);text-shadow:0 0 18px var(--neon),0 0 40px var(--neon);animation:goPop .5s ease-out;}
@keyframes goPop{0%{transform:scale(.3);opacity:0;}100%{transform:scale(1);opacity:1;}}
.waiting-msg{font-size:20px;color:#b9b2e6;line-height:1.6;}

/* 연타 버튼 + HUD */
.tap-hud{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 16px;z-index:5;pointer-events:none;}
.timer-big{font-family:'Press Start 2P';font-size:30px;color:var(--cyan);text-shadow:0 0 12px var(--cyan),2px 2px 0 #000;}
.timer-big.danger{color:var(--pink);text-shadow:0 0 14px var(--pink);animation:blink .5s infinite;}
.myscore{font-family:'Press Start 2P';font-size:30px;color:var(--gold);text-shadow:0 0 12px var(--gold),2px 2px 0 #000;text-align:right;}
.myscore small{display:block;font-size:9px;color:#9b93c9;margin-top:4px;}

.combo{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center;opacity:0;}
.combo .n{font-family:'Press Start 2P';font-size:64px;line-height:1;text-shadow:3px 3px 0 #000;}
.combo .l{font-family:'Press Start 2P';font-size:16px;letter-spacing:2px;margin-top:6px;}
.combo.show{animation:comboPunch .18s ease-out;opacity:1;}
@keyframes comboPunch{0%{transform:translate(-50%,-50%) scale(1.45);}100%{transform:translate(-50%,-50%) scale(1);}}

.tap-btn{
  position:relative;z-index:4;width:230px;height:230px;border-radius:50%;
  border:none;cursor:pointer;color:#0a0a14;
  font-family:'Press Start 2P';font-size:24px;
  background:radial-gradient(circle at 35% 30%, #7dff5e, #1faf06 70%);
  box-shadow:0 0 0 6px #0a3d00, 0 0 40px rgba(57,255,20,.6), inset 0 -10px 24px rgba(0,0,0,.35);
  transition:transform .04s;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.4;
  animation:btnPulse 1.1s ease-in-out infinite;
}
@keyframes btnPulse{50%{box-shadow:0 0 0 6px #0a3d00,0 0 60px rgba(57,255,20,.9),inset 0 -10px 24px rgba(0,0,0,.35);}}
.tap-btn.punch{transform:scale(.86);}

/* 라이브 순위(방 안 오른쪽) */
.live-rank{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto;}
.lr-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:#0e0a22;font-size:15px;transition:transform .2s;}
.lr-row .no{font-family:'Press Start 2P';font-size:11px;width:24px;color:#9b93c9;}
.lr-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lr-row .sc{font-family:'Press Start 2P';font-size:12px;color:var(--gold);}
.lr-row.me{outline:2px solid var(--cyan);}
.lr-row.r1{background:linear-gradient(90deg,rgba(255,210,74,.22),transparent);}

/* 결과 */
.result-box{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,4,16,.86);padding:24px;text-align:center;}
.result-title{font-family:'Press Start 2P';font-size:26px;color:var(--gold);text-shadow:0 0 16px var(--gold);animation:goPop .5s;}
.result-list{width:100%;max-width:360px;display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow-y:auto;}
.res-row{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:10px;background:#120c28;font-size:17px;}
.res-row .medal{font-size:22px;width:30px;text-align:center;}
.res-row .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.res-row .sc{font-family:'Press Start 2P';font-size:14px;color:var(--gold);}
.res-row.top1{background:linear-gradient(90deg,rgba(255,210,74,.25),#120c28);border:1px solid var(--gold);}
.res-row.me{outline:2px solid var(--cyan);}
.result-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center;}

.scroll::-webkit-scrollbar{width:7px;}
.scroll::-webkit-scrollbar-thumb{background:#2b2350;border-radius:5px;}
</style>
</head>
<body>

<!-- ====== 로그인 화면 ====== -->
<div id="loginScreen">
  <div class="logo">TAP <span class="y">BATTLE</span></div>
  <div class="logo-sub">⚡ 실시간 연타 대결 ⚡</div>
  <div class="login-box panel">
    <input type="text" id="nickInput" placeholder="닉네임을 입력하세요" maxlength="12" autocomplete="off">
    <button class="btn" onclick="joinGame()">▶ 입 장 하 기</button>
    <button class="btn ghost" id="soundToggle" onclick="toggleSound()">🔊 소리 ON</button>
    <div class="login-tip">방을 만들거나 들어가서 방장이 시작하면<br>3초 카운트 후 <b>10초간 미친듯이 연타!</b><br>가장 많이 누른 사람이 1위 🏆</div>
  </div>
</div>

<!-- ====== 메인 앱 ====== -->
<div id="app">
  <div class="topbar panel">
    <span class="title">TAP BATTLE</span>
    <span class="spacer"></span>
    <span class="pill"><span class="dot-live"></span>동시접속 <b id="onlineCount">0</b>명</span>
    <span class="pill mybadge">🎮 <b id="myNick">-</b></span>
    <button class="btn ghost" style="padding:7px 12px;font-size:14px" id="soundToggle2" onclick="toggleSound()">🔊</button>
  </div>

  <!-- 로비 -->
  <div id="lobby" class="lobby">
    <div class="col">
      <div class="panel pad">
        <div class="section-title">▶ 방 만들기</div>
        <div class="make-room">
          <input type="text" id="roomNameInput" placeholder="방 이름 (예: 손가락 빠른사람만)" maxlength="18">
          <button class="btn gold" onclick="createRoom()">＋ 만들기</button>
        </div>
      </div>
      <div class="panel pad">
        <div class="section-title">▶ 대기방 목록</div>
        <div class="room-list scroll" id="roomList"><div class="room-empty">아직 방이 없어요. 직접 만들어보세요!</div></div>
      </div>
    </div>

    <div class="col">
      <div class="panel pad">
        <div class="section-title g">🏆 연타 랭킹 TOP 10</div>
        <div class="rank-list scroll" id="leaderboard"><div class="room-empty">아직 기록이 없어요</div></div>
      </div>
      <div class="panel pad">
        <div class="section-title">💬 채팅</div>
        <div class="chat-box">
          <div class="chat-msgs scroll" id="chatMsgs"></div>
          <div class="chat-input">
            <input type="text" id="chatInput" placeholder="메시지..." maxlength="80" onkeydown="if(event.key==='Enter')sendChat()">
            <button class="btn" onclick="sendChat()">전송</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 방(게임) 화면 -->
  <div id="roomView">
    <div class="room-top panel">
      <span class="rn" id="roomTitle">방 이름</span>
      <button class="btn ghost" style="padding:8px 14px" onclick="leaveRoom()">✖ 나가기</button>
    </div>

    <div class="game-wrap">
      <div id="stage">
        <canvas id="fxCanvas"></canvas>

        <!-- HUD (연타 중) -->
        <div class="tap-hud" id="tapHud" style="display:none">
          <div class="timer-big" id="timerBig">10</div>
          <div class="myscore"><span id="myScoreNum">0</span><small>MY TAPS</small></div>
        </div>

        <!-- 콤보 -->
        <div class="combo" id="comboBox"><div class="n" id="comboNum">0</div><div class="l" id="comboLabel">COMBO</div></div>

        <!-- 카운트다운 / 대기 메시지 -->
        <div class="center-msg" id="centerMsg">
          <div class="waiting-msg" id="waitingMsg">상대를 기다리는 중...</div>
        </div>

        <!-- 연타 버튼 -->
        <button class="tap-btn" id="tapBtn" style="display:none">TAP!</button>

        <!-- 결과 -->
        <div class="result-box" id="resultBox" style="display:none">
          <div class="result-title" id="resultTitle">🏆 결과</div>
          <div class="result-list scroll" id="resultList"></div>
          <div class="result-actions" id="resultActions"></div>
        </div>
      </div>

      <div class="panel pad">
        <div class="section-title">⚔ 실시간 순위</div>
        <div class="live-rank scroll" id="liveRank"></div>
        <div id="hostStartArea" style="margin-top:14px;display:none">
          <button class="btn pink" style="width:100%;font-size:18px" id="startBtn" onclick="hostStart()">▶ 게임 스타트</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   0. Firebase 초기화 (기존 강화 시뮬과 동일 프로젝트)
   ========================================================= */
const firebaseConfig = {
  apiKey:"AIzaSyBcNiClyycbiDyTNgABSMZUxy1Pub8Rezo",
  authDomain:"inchanchat.firebaseapp.com",
  projectId:"inchanchat",
  storageBucket:"inchanchat.firebasestorage.app",
  messagingSenderId:"519834039681",
  appId:"1:519834039681:web:90ff93ef38793429c76480"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOT = "tapGame";                 // ← 강화 시뮬 데이터와 안 섞이게 별도 폴더
const TS = firebase.database.ServerValue.TIMESTAMP;

/* =========================================================
   1. 전역 상태
   ========================================================= */
const myUserId = 'u_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36);
let myName = "";
let soundOn = true;
let serverOffset = 0;                    // 서버시간 보정
const serverNow = () => Date.now() + serverOffset;

let currentRoomId = null;
let currentRoom = null;                  // 방 데이터 스냅샷
let roomRef = null, roomListener = null;

// 게임 진행 상태
let phase = "lobby";                     // lobby / waiting / countdown / playing / result
let localScore = 0;                      // 내 연타 수(로컬, 즉시 증가)
let lastSentScore = -1;
let lastFlushAt = 0;
let gameTickTimer = null;

// 콤보/타격감
let combo = 0;
let comboMax = 0;
let lastTapTime = 0;
let shakeMag = 0;

db.ref('.info/serverTimeOffset').on('value', s => serverOffset = s.val() || 0);

/* =========================================================
   2. 사운드 (WebAudio - 외부 파일 불필요)
   ========================================================= */
let audioCtx = null;
function initAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function playTapSound(c){
  if(!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  const base = 480 + Math.min(c,120)*6;          // 콤보 높을수록 음 높아짐
  o.frequency.setValueAtTime(base, t);
  o.frequency.exponentialRampToValueAtTime(base*0.6, t+0.05);
  g.gain.setValueAtTime(0.16, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.06);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+0.07);
}
function toggleSound(){
  soundOn = !soundOn;
  const t = soundOn ? '🔊 소리 ON' : '🔇 소리 OFF';
  const a=document.getElementById('soundToggle'); if(a) a.textContent=t;
  const b=document.getElementById('soundToggle2'); if(b) b.textContent= soundOn?'🔊':'🔇';
  if(soundOn) initAudio();
}

/* =========================================================
   3. 입장 / 닉네임
   ========================================================= */
function joinGame(){
  const n = document.getElementById('nickInput').value.trim();
  if(!n){ alert('닉네임을 입력해주세요!'); return; }
  myName = n;
  initAudio();

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('myNick').textContent = myName;

  // 접속자 등록 (presence)
  const presRef = db.ref(ROOT+'/presence/'+myUserId);
  presRef.set({ name: myName, ts: TS });
  presRef.onDisconnect().remove();

  // 리스너 시작
  db.ref(ROOT+'/presence').on('value', s => {
    document.getElementById('onlineCount').textContent = s.numChildren();
  });
  watchRooms();
  watchLeaderboard();
  watchChat();
}

/* =========================================================
   4. 채팅
   ========================================================= */
function watchChat(){
  const box = document.getElementById('chatMsgs');
  db.ref(ROOT+'/chats').limitToLast(40).on('child_added', snap=>{
    const m = snap.val();
    const div = document.createElement('div');
    div.className = 'cm' + (m.user==='SYSTEM'?' sys':'');
    if(m.user==='SYSTEM'){ div.textContent = '📢 ' + m.message; }
    else { div.innerHTML = `<span class="u">${esc(m.user)}</span> ${esc(m.message)}`; }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  });
}
function sendChat(){
  const inp = document.getElementById('chatInput');
  const msg = inp.value.trim();
  if(!msg) return;
  db.ref(ROOT+'/chats').push({ user: myName, message: msg, ts: TS });
  inp.value='';
}
function sysChat(msg){ db.ref(ROOT+'/chats').push({ user:'SYSTEM', message: msg, ts: TS }); }

/* =========================================================
   5. 연타 랭킹 (닉네임별 최고기록)
   ========================================================= */
function watchLeaderboard(){
  db.ref(ROOT+'/leaderboard').on('value', s=>{
    const arr = [];
    s.forEach(c=>{ const v=c.val(); arr.push({name:v.name, score:v.score}); });
    arr.sort((a,b)=>b.score-a.score);
    const top = arr.slice(0,10);
    const box = document.getElementById('leaderboard');
    if(top.length===0){ box.innerHTML='<div class="room-empty">아직 기록이 없어요</div>'; return; }
    box.innerHTML = top.map((r,i)=>{
      const cls = i===0?'top1':i===1?'top2':i===2?'top3':'';
      const me = r.name===myName?' me':'';
      return `<div class="rank-row ${cls}${me}"><span class="no">${i+1}</span><span class="nm">${esc(r.name)}</span><span class="sc">${r.score}</span></div>`;
    }).join('');
  });
}
function saveBestScore(score){
  const key = safeKey(myName);
  const ref = db.ref(ROOT+'/leaderboard/'+key);
  ref.transaction(cur=>{
    if(cur && cur.score >= score) return cur;     // 기존 기록이 더 높으면 유지
    return { name: myName, score: score, ts: Date.now() };
  });
}

/* =========================================================
   6. 방 목록
   ========================================================= */
function watchRooms(){
  db.ref(ROOT+'/rooms').on('value', s=>{
    const list = document.getElementById('roomList');
    const rooms = [];
    s.forEach(c=>{ const v=c.val(); v.id=c.key; rooms.push(v); });
    rooms.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(rooms.length===0){ list.innerHTML='<div class="room-empty">아직 방이 없어요. 직접 만들어보세요!</div>'; return; }
    list.innerHTML = rooms.map(r=>{
      const cnt = r.players ? Object.keys(r.players).length : 0;
      const playing = (r.phase==='countdown'||r.phase==='playing');
      const state = playing ? '<span class="rstate st-play">PLAY</span>' : '<span class="rstate st-wait">WAIT</span>';
      return `<div class="room-item">
        <div style="flex:1;min-width:0">
          <div class="rname">${esc(r.name||'무제')}</div>
          <div class="rmeta">방장 ${esc(r.hostName||'?')} · 👥 ${cnt}명</div>
        </div>
        ${state}
        <button class="btn" style="padding:9px 14px;font-size:15px" onclick="joinRoom('${r.id}')">입장</button>
      </div>`;
    }).join('');
  });
}

/* =========================================================
   7. 방 만들기 / 입장 / 나가기
   ========================================================= */
function createRoom(){
  const name = document.getElementById('roomNameInput').value.trim();
  if(!name){ alert('방 이름을 입력해주세요!'); return; }
  if(currentRoomId){ alert('이미 방에 있습니다.'); return; }
  const ref = db.ref(ROOT+'/rooms').push();
  ref.set({
    name: name, host: myUserId, hostName: myName,
    phase:'waiting', roundStartAt:0, createdAt: TS,
    players: { [myUserId]: { name: myName, score:0, joinedAt: TS } }
  }).then(()=>{
    document.getElementById('roomNameInput').value='';
    enterRoom(ref.key);
  });
}
function joinRoom(id){
  if(currentRoomId){ alert('이미 방에 있습니다.'); return; }
  const pref = db.ref(ROOT+'/rooms/'+id+'/players/'+myUserId);
  pref.set({ name: myName, score:0, joinedAt: TS }).then(()=> enterRoom(id));
}
function enterRoom(id){
  currentRoomId = id;
  roomRef = db.ref(ROOT+'/rooms/'+id);
  // 연결 끊기면 내 플레이어 자동 삭제
  roomRef.child('players/'+myUserId).onDisconnect().remove();

  document.getElementById('lobby').style.display='none';
  document.getElementById('roomView').style.display='block';
  resetStageUI();
  setupFxCanvas();
  startGameTick();

  roomListener = roomRef.on('value', snap=> onRoomUpdate(snap.val()));
}
function leaveRoom(){
  if(!roomRef) return;
  roomRef.child('players/'+myUserId).onDisconnect().cancel();
  roomRef.child('players/'+myUserId).remove();
  // 내가 나가서 빈 방이면 삭제
  roomRef.child('players').once('value', s=>{
    if(s.numChildren()===0) roomRef.remove();
  });
  cleanupRoom();
}
function cleanupRoom(){
  if(roomRef && roomListener) roomRef.off('value', roomListener);
  stopGameTick();
  roomRef=null; roomListener=null; currentRoomId=null; currentRoom=null;
  phase='lobby';
  document.getElementById('roomView').style.display='none';
  document.getElementById('lobby').style.display='grid';
}

/* =========================================================
   8. 방 데이터 변경 처리
   ========================================================= */
function onRoomUpdate(room){
  if(!room){ // 방이 삭제됨
    alert('방이 종료되었습니다.');
    cleanupRoom();
    return;
  }
  currentRoom = room;
  document.getElementById('roomTitle').textContent = room.name || '방';

  // 방장이 나갔으면 가장 먼저 들어온 사람이 방장 승계
  const players = room.players || {};
  if(!players[room.host]){
    const ids = Object.keys(players).sort((a,b)=>(players[a].joinedAt||0)-(players[b].joinedAt||0));
    if(ids.length && ids[0]===myUserId){
      roomRef.update({ host: myUserId, hostName: myName });
    }
    if(ids.length===0){ roomRef.remove(); return; }
  }

  const amHost = (room.host===myUserId);
  // 스타트 버튼은 방장 + (대기/결과) 상태에서만
  const canStart = amHost && (room.phase==='waiting' || room.phase==='result');
  document.getElementById('hostStartArea').style.display = amHost ? 'block':'none';
  document.getElementById('startBtn').disabled = !canStart;
  document.getElementById('startBtn').textContent = (room.phase==='result') ? '🔄 다시하기' : '▶ 게임 스타트';

  renderLiveRank();
  // phase 전환은 gameTick이 roundStartAt 기준으로 처리 (시계 동기화)
}

/* =========================================================
   9. 게임 진행 타이머 (모든 클라이언트 공통, 서버시간 기준)
   ========================================================= */
const COUNT_MS = 3000;     // 카운트다운 3초
const PLAY_MS  = 10000;    // 연타 10초

function startGameTick(){
  stopGameTick();
  gameTickTimer = setInterval(gameTick, 33);
}
function stopGameTick(){ if(gameTickTimer){ clearInterval(gameTickTimer); gameTickTimer=null; } }

function gameTick(){
  if(!currentRoom) return;
  const start = currentRoom.roundStartAt || 0;

  // 라운드가 시작 안 된 상태
  if(!start || currentRoom.phase==='waiting'){
    if(phase!=='waiting'){ enterWaiting(); }
    return;
  }

  const now = serverNow();
  const countEnd = start + COUNT_MS;
  const playEnd  = start + COUNT_MS + PLAY_MS;

  if(now < countEnd){
    // 카운트다운
    if(phase!=='countdown') enterCountdown();
    const remain = Math.ceil((countEnd - now)/1000);   // 3,2,1
    showCount(remain);
  } else if(now < playEnd){
    // 연타!
    if(phase!=='playing') enterPlaying();
    const remain = Math.ceil((playEnd - now)/1000);
    updateTimer(remain);
    // 점수 주기적 전송(0.5초마다)
    if(localScore!==lastSentScore && now-lastFlushAt>500){
      flushScore();
    }
    // 콤보 자연 감소(0.7초 이상 안 누르면 리셋)
    if(combo>0 && Date.now()-lastTapTime>700){ combo=0; hideCombo(); }
  } else {
    // 결과
    if(phase!=='result') enterResult();
  }
}

function enterWaiting(){
  phase='waiting';
  hideAll();
  const cm = document.getElementById('centerMsg');
  cm.style.display='flex';
  const amHost = currentRoom && currentRoom.host===myUserId;
  document.getElementById('waitingMsg').innerHTML = amHost
    ? '준비됐으면 오른쪽 <b>스타트</b>를 눌러주세요!'
    : '방장이 게임을 시작하기를<br>기다리는 중...';
}
function enterCountdown(){
  phase='countdown';
  localScore=0; combo=0; comboMax=0; lastSentScore=-1;
  hideAll();
  document.getElementById('centerMsg').style.display='flex';
  document.getElementById('waitingMsg').style.display='none';
}
let lastShownCount = -1;
function showCount(n){
  const cm = document.getElementById('centerMsg');
  if(n===lastShownCount) return;
  lastShownCount=n;
  cm.innerHTML = `<div class="count-num">${n}</div>`;
  playTapSound(0);
  if(navigator.vibrate) navigator.vibrate(40);
}
function enterPlaying(){
  phase='playing';
  lastShownCount=-1;
  hideAll();
  const cm=document.getElementById('centerMsg');
  cm.style.display='flex';
  cm.innerHTML = '<div class="count-go">연타!!!</div>';
  playTapSound(60);
  if(navigator.vibrate) navigator.vibrate([60,30,60]);
  setTimeout(()=>{ if(phase==='playing') cm.style.display='none'; }, 450);

  document.getElementById('tapHud').style.display='flex';
  document.getElementById('tapBtn').style.display='flex';
  document.getElementById('myScoreNum').textContent='0';
  updateTimer(10);
  fxRunning=true; requestAnimationFrame(fxLoop);
}
function updateTimer(sec){
  const t=document.getElementById('timerBig');
  t.textContent=sec;
  t.classList.toggle('danger', sec<=3);
}
function enterResult(){
  if(phase==='playing'){ flushScore(); saveBestScore(localScore); }
  phase='result';
  fxRunning=false;
  hideAll();
  // 방장이 phase를 result로 기록(방 목록 표시용)
  if(currentRoom && currentRoom.host===myUserId && currentRoom.phase!=='result'){
    roomRef.update({ phase:'result' });
  }
  renderResult();
}

function flushScore(){
  lastSentScore=localScore; lastFlushAt=serverNow();
  if(roomRef) roomRef.child('players/'+myUserId+'/score').set(localScore);
}

/* =========================================================
   10. 방장: 스타트 / 다시하기
   ========================================================= */
function hostStart(){
  if(!currentRoom || currentRoom.host!==myUserId) return;
  const players = currentRoom.players || {};
  // 모든 플레이어 점수 0으로 초기화 + 라운드 시작 시각 기록
  const updates = { phase:'countdown', roundStartAt: TS };
  Object.keys(players).forEach(id=>{ updates['players/'+id+'/score']=0; });
  roomRef.update(updates);
  sysChat(`[${esc(currentRoom.name)}] 방에서 연타 배틀 시작! ⚡`);
}

/* =========================================================
   11. 실시간 순위 / 결과 렌더링
   ========================================================= */
function getRankArray(){
  const players = (currentRoom && currentRoom.players) || {};
  const arr = Object.keys(players).map(id=>({
    id, name: players[id].name,
    score: (id===myUserId && (phase==='playing')) ? localScore : (players[id].score||0)
  }));
  arr.sort((a,b)=>b.score-a.score);
  return arr;
}
function renderLiveRank(){
  const arr = getRankArray();
  const box = document.getElementById('liveRank');
  box.innerHTML = arr.map((r,i)=>{
    const me = r.id===myUserId?' me':'';
    const r1 = i===0?' r1':'';
    return `<div class="lr-row${me}${r1}"><span class="no">${i+1}</span><span class="nm">${esc(r.name)}</span><span class="sc">${r.score}</span></div>`;
  }).join('');
}
function renderResult(){
  const arr = getRankArray();
  document.getElementById('resultBox').style.display='flex';
  const medals=['🥇','🥈','🥉','4','5'];
  const myRank = arr.findIndex(r=>r.id===myUserId)+1;
  let title='🏆 결과';
  if(myRank===1) title='🎉 1위 달성! 🎉';
  else if(myRank<=5 && myRank>0) title=`🏅 ${myRank}위!`;
  document.getElementById('resultTitle').textContent=title;

  document.getElementById('resultList').innerHTML = arr.slice(0,Math.max(5,arr.length)).map((r,i)=>{
    const me=r.id===myUserId?' me':'';
    const top1=i===0?' top1':'';
    const medal = i<3?medals[i]:(i+1);
    return `<div class="res-row${top1}${me}"><span class="medal">${medal}</span><span class="nm">${esc(r.name)}</span><span class="sc">${r.score}</span></div>`;
  }).join('');

  const amHost = currentRoom && currentRoom.host===myUserId;
  document.getElementById('resultActions').innerHTML = amHost
    ? `<button class="btn pink" onclick="hostStart()">🔄 다시하기</button><button class="btn ghost" onclick="leaveRoom()">나가기</button>`
    : `<div class="waiting-msg" style="font-size:16px">방장이 다시 시작하길 기다리는 중...</div><button class="btn ghost" onclick="leaveRoom()">나가기</button>`;
}

/* =========================================================
   12. ★ 연타 + 타격감 이펙트 ★
   ========================================================= */
const stage = document.getElementById('stage');
const tapBtn = document.getElementById('tapBtn');
const canvas = document.getElementById('fxCanvas');
const ctx = canvas.getContext('2d');
let cw=0, ch=0, dpr=1;
let particles=[], floats=[];
let fxRunning=false;
let lastVibe=0;

function setupFxCanvas(){
  resizeCanvas();
}
function resizeCanvas(){
  dpr = window.devicePixelRatio||1;
  const r = stage.getBoundingClientRect();
  cw=r.width; ch=r.height;
  canvas.width=cw*dpr; canvas.height=ch*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', ()=>{ if(currentRoomId) resizeCanvas(); });

// 콤보 색상 단계
function comboColor(c){
  if(c<10) return '#ffffff';
  if(c<25) return '#ffe07a';
  if(c<50) return '#ffae3a';
  if(c<90) return '#ff2e88';
  // 90 이상 무지개
  const hue = (Date.now()/4)%360;
  return `hsl(${hue},100%,60%)`;
}

function doTap(clientX, clientY){
  if(phase!=='playing') return;
  localScore++;
  combo++;
  if(combo>comboMax) comboMax=combo;
  lastTapTime=Date.now();

  document.getElementById('myScoreNum').textContent=localScore;

  // 좌표 (스테이지 기준)
  const r=stage.getBoundingClientRect();
  const x = clientX - r.left, y = clientY - r.top;

  const col = comboColor(combo);

  // 1) 파티클 폭발
  const burst = 8 + Math.min(combo,40)*0.4;
  for(let i=0;i<burst;i++){
    const ang=Math.random()*Math.PI*2;
    const spd=2+Math.random()*(4+combo*0.05);
    particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1,life:1,
      size:2+Math.random()*4, color: Math.random()<0.5?col:'#ffffff'});
  }
  if(particles.length>500) particles.splice(0,particles.length-500);

  // 2) +1 떠오르는 숫자
  floats.push({x:x+(Math.random()*30-15), y:y-10, vy:-1.6, life:1,
    text:'+1', color:col, size:22+Math.min(combo,30)*0.5});

  // 3) 버튼 펀치 + 스테이지 플래시
  tapBtn.classList.remove('punch'); void tapBtn.offsetWidth; tapBtn.classList.add('punch');
  stage.classList.remove('flash'); void stage.offsetWidth; stage.classList.add('flash');

  // 4) 콤보 표시
  showCombo(combo, col);

  // 5) 화면 흔들림 (콤보 클수록 세게)
  shakeMag = Math.min(shakeMag + 2 + combo*0.05, 16);

  // 6) 사운드 + 진동
  playTapSound(combo);
  const nowm=Date.now();
  if(navigator.vibrate && nowm-lastVibe>25){ navigator.vibrate(combo>=90?14:8); lastVibe=nowm; }
}

function showCombo(c, col){
  const box=document.getElementById('comboBox');
  const num=document.getElementById('comboNum');
  num.textContent = c;
  num.style.color = col;
  num.style.textShadow = `0 0 14px ${col}, 3px 3px 0 #000`;
  document.getElementById('comboLabel').style.color = col;
  box.classList.remove('show'); void box.offsetWidth; box.classList.add('show');
}
function hideCombo(){ document.getElementById('comboBox').classList.remove('show'); document.getElementById('comboBox').style.opacity='0'; }

// 입력 바인딩 (스테이지 어디든 탭 = 점수, 멀티터치 지원)
stage.addEventListener('pointerdown', e=>{ e.preventDefault(); doTap(e.clientX, e.clientY); }, {passive:false});
// 데스크탑: 스페이스바 연타
window.addEventListener('keydown', e=>{
  if(e.code==='Space' && phase==='playing'){
    e.preventDefault();
    const r=stage.getBoundingClientRect();
    doTap(r.left+r.width/2, r.top+r.height/2);
  }
});

// 애니메이션 루프 (연타 중에만 + 잔여 파티클)
function fxLoop(){
  ctx.clearRect(0,0,cw,ch);

  // 화면 흔들림
  if(shakeMag>0.3){
    const dx=(Math.random()*2-1)*shakeMag;
    const dy=(Math.random()*2-1)*shakeMag;
    stage.style.transform=`translate(${dx}px,${dy}px)`;
    shakeMag*=0.86;
  } else { stage.style.transform=''; shakeMag=0; }

  // 파티클
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.vx*=0.98; p.life-=0.03;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(p.life,0);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  // 떠오르는 숫자
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];
    f.y+=f.vy; f.vy*=0.97; f.life-=0.025;
    if(f.life<=0){ floats.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(f.life,0);
    ctx.fillStyle=f.color;
    ctx.font=`bold ${f.size}px 'Press Start 2P', monospace`;
    ctx.textAlign='center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha=1;

  if(fxRunning || particles.length || floats.length || shakeMag>0.3){
    requestAnimationFrame(fxLoop);
  } else {
    stage.style.transform='';
  }
}

/* =========================================================
   13. UI 보조
   ========================================================= */
function hideAll(){
  document.getElementById('tapHud').style.display='none';
  document.getElementById('tapBtn').style.display='none';
  document.getElementById('resultBox').style.display='none';
  document.getElementById('centerMsg').style.display='none';
  document.getElementById('centerMsg').innerHTML='<div class="waiting-msg" id="waitingMsg"></div>';
  hideCombo();
}
function resetStageUI(){ phase='waiting'; hideAll(); }

function esc(s){ const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function safeKey(s){ return String(s).replace(/[.#$\[\]\/]/g,'_'); }
</script>
